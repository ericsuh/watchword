name: Security nightly

on:
  schedule:
    # 03:17 UTC daily; off the hour to avoid the top-of-hour rush.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Steps run `mise run <task>`, as in ci.yml; `.github/scripts/install-mise.sh` installs and configures mise
# (on the Linux job too, where it also disables the macOS-only XcodeGen).

# Pinned to full commit SHAs, not tags (docs/07-supply-chain.md).
#   actions/checkout        v4 -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/upload-artifact v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  long-adversarial:
    # Longer randomised runs of the sync/sharing simulations and adversarial suites
    # (docs/04-test-plan.md §1). WATCHWORD_LONG_TESTS lets tests opt into more iterations.
    name: Long randomised adversarial runs
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 27.0
      - name: Install mise
        run: .github/scripts/install-mise.sh
      # Replay a failure locally with `mise run test:long --seed <the seed printed in this step>`.
      - name: mise run test:long
        env:
          SEED: ${{ github.run_id }}
        run: mise run test:long --seed "$SEED"

  fuzz:
    # libFuzzer harnesses for parsers and the envelope decoder (docs/04-test-plan.md §6.8).
    # Each executable target under Fuzz/ is built with -sanitize=fuzzer and run for a bounded
    # time. Skips cleanly until the first harness exists.
    name: Fuzz parsers
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 27.0
      - name: Install mise
        run: .github/scripts/install-mise.sh
      - name: mise run fuzz
        run: mise run fuzz --max-total-time 1800
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: artifacts
          if-no-files-found: ignore

  action-pinning-audit:
    # A tag can be moved; a SHA cannot. This fails if any workflow starts referencing an action
    # by tag or branch, which is the quiet way a supply-chain foothold gets introduced.
    name: Audit action pinning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install mise
        run: .github/scripts/install-mise.sh
      # Every `uses:` must be a 40-hex SHA.
      - name: mise run audit:actions
        run: mise run audit:actions
