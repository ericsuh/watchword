name: Mac run

# One CI gate on one branch, on a macOS runner, started by hand or through the API. This is how a session without
# Xcode (a Linux cloud session, docs/09-cloud-sessions.md §5) compiles and tests Apple-framework code before pushing it
# to a pull request: it dispatches this on its branch, then reads the job log. Nothing here gates a merge; ci.yml does.
#
# A dispatch runs this file and `mise run ci:gate` as they are on the dispatched branch, so whoever can dispatch it can
# change what it runs, and a branch cut before this file reached main has no Mac run until it is rebased. The controls
# are the repository's: only an account with write access can dispatch (or push the branch), the workflow uses no
# secrets, and its token is read-only (`contents: read` here, and read is the repository default,
# docs/08-repository-hardening.md §1). What this file and ci:gate add is narrower: inputs reach the shell only through
# `env:`, never `${{ }}` in a `run:` line, and ci:gate refuses a mistyped or prompt-influenced request (an unknown gate,
# a filter on a gate that takes none or that looks like an option, a combination ci.yml never runs) before it costs a
# runner or passes without testing anything.

on:
  workflow_dispatch:
    inputs:
      gate:
        description: The gate to run (a mise task)
        type: choice
        options: [test, "test:adversarial", build, "build:strict", lint, "app:test", "app:release", "app:screenshots", check]
        default: test
      filter:
        description: "test: a swift test --filter regex. app:test (ios/macos): an -only-testing identifier. Empty for all"
        type: string
        default: ""
      platform:
        description: "app:test, app:release and app:screenshots only: which app"
        type: choice
        options: [macos, ios, all]
        default: macos
      appearance:
        description: "app:screenshots only: dark tours the app in the dark appearance"
        type: choice
        options: [light, dark]
        default: light
      device:
        description: "app:screenshots (ios, all) only: ipad tours on an iPad simulator"
        type: choice
        options: [iphone, ipad]
        default: iphone
      xcode:
        description: "27.0: xcode-27 (macOS 27), every gate. 16.4: macos-15, ci.yml's oldest leg, build and test only"
        type: choice
        options: ["27.0", "16.4"]
        default: "27.0"

# The platform is shown for the app gates, which are the ones that read it; the filter when there is one; and a
# screenshot set that is not the default.
run-name: >-
  Mac run: ${{ inputs.gate }}${{ startsWith(inputs.gate, 'app:') && format(' {0}', inputs.platform) || '' }}${{
  inputs.appearance != 'light' && format(' {0}', inputs.appearance) || '' }}${{
  inputs.device != 'iphone' && format(' {0}', inputs.device) || '' }}${{
  inputs.filter != '' && format(' --filter={0}', inputs.filter) || '' }} on ${{ github.ref_name }} (Xcode ${{
  inputs.xcode }})

# One group per request (branch, gate, platform, screenshot set, Xcode, filter), so different requests never cancel one
# another. For repeats of one request GitHub keeps one run going and one pending, and a newer dispatch cancels the
# pending one: the only cancelling, and what survives is the later dispatch.
concurrency:
  group: >-
    ${{ github.workflow }} ${{ github.ref }} ${{ inputs.gate }} ${{ inputs.platform }} ${{ inputs.appearance }}
    ${{ inputs.device }} ${{ inputs.xcode }} ${{ inputs.filter }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Pinned to full commit SHAs, not tags (docs/07-supply-chain.md).
#   actions/checkout        v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/upload-artifact v7.0.2 -> cf430e030ddbb5b0abf93d22962f4752f3646cd9

jobs:
  gate:
    name: >-
      ${{ inputs.gate }}${{ startsWith(inputs.gate, 'app:') && format(' {0}', inputs.platform) || '' }}${{
      inputs.filter != '' && format(' --filter={0}', inputs.filter) || '' }} (Xcode ${{ inputs.xcode }})
    runs-on: ${{ inputs.xcode == '16.4' && 'macos-15' || 'xcode-27' }}
    # ci.yml and screenshots.yml give each platform its own 60-minute job; `all` runs both here, one after the other.
    timeout-minutes: ${{ startsWith(inputs.gate, 'app:') && inputs.platform == 'all' && 120 || 60 }}
    permissions:
      contents: read
    steps:
      # The dispatched ref: the branch named when the run was started.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: .github/scripts/select-xcode.sh "$XCODE_VERSION"

      - name: Install mise
        run: .github/scripts/install-mise.sh

      # As in ci.yml's app-tests job: XcodeGen at the version and SHA-256 in mise.lock.
      - name: Install XcodeGen (mise, locked)
        if: startsWith(inputs.gate, 'app:')
        run: mise install xcodegen

      - name: mise run ci:gate ${{ inputs.gate }}
        env:
          GATE: ${{ inputs.gate }}
          FILTER: ${{ inputs.filter }}
          PLATFORM: ${{ inputs.platform }}
          APPEARANCE: ${{ inputs.appearance }}
          DEVICE: ${{ inputs.device }}
          XCODE_VERSION: ${{ inputs.xcode }}
        # `--flag=value`, one word each: mise reads a separate value that starts with `-` (`--help`) as an option.
        # An empty filter means none.
        run: >-
          mise run ci:gate "$GATE" "--platform=$PLATFORM" "--appearance=$APPEARANCE" "--device=$DEVICE"
          "--xcode=$XCODE_VERSION" "--filter=$FILTER"

      # app:screenshots writes Screenshots/<set>/ (the PNGs and their index) and, beside them, every screen of the set
      # in one PNG; a capture that failed leaves what it has in Screenshots/<set>-incomplete/ instead. They come down in
      # the same zip as the logs.
      - name: Upload logs, result bundles and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-run-${{ github.run_id }}
          path: |
            gate.log
            test-output.log
            coverage.txt
            adversarial.log
            TestResults
            Screenshots
          if-no-files-found: ignore
