name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; no job in this workflow needs more. Note the trigger is
# `pull_request`, not `pull_request_target`, so a fork's code never runs with repository secrets.
permissions:
  contents: read

# `bash` as the default shell runs with `-eo pipefail`. The task scripts set `-euo pipefail` themselves, so a failing
# `swift test` is not masked by the `| tee` that captures its output either way.
defaults:
  run:
    shell: bash

# Every step past checkout and Xcode selection is `mise run <task>`, the same command a developer runs locally
# (mise.toml, `mise-tasks/`), so a red step reproduces with the command in its log. `.github/scripts/install-mise.sh`
# installs mise (pinned by version and SHA-256) and sets its CI behaviour for the rest of the job: locked tool
# downloads, no auto-install, no version host. The settings and their reasons are listed in that script.

# Third-party actions are pinned to full commit SHAs, not tags: a tag is mutable, so `@v4` is a
# standing grant of code execution in CI to whoever can move it (docs/07-supply-chain.md).
#   actions/checkout        v4 -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/upload-artifact v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  package-tests:
    name: Package tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported toolchain (Swift 6.0) on macOS 15.
          - name: Xcode 16.4 / macOS 15
            runner: macos-15
            xcode: "16.4"
          # Current toolchain on macOS 27. GitHub keys macOS images by Xcode major from 27 on, so the
          # macOS 27 runner is `xcode-27`; there is no `macos-27` label. 27.0 is the image's one
          # non-beta, non-RC Xcode.
          - name: Xcode 27 / macOS 27
            runner: xcode-27
            xcode: "27.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: .github/scripts/select-xcode.sh "$XCODE_VERSION"

      - name: Install mise
        run: .github/scripts/install-mise.sh

      - name: mise run audit:dependencies
        run: mise run audit:dependencies

      - name: mise run build
        run: mise run build -v

      # Both the Swift Testing and XCTest suites; the task fails unless the log shows each framework executed tests,
      # and writes coverage.txt whether or not they passed.
      - name: mise run test --coverage
        run: mise run test --coverage --log test-output.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs-${{ strategy.job-index }}
          path: |
            test-output.log
            coverage.txt
          if-no-files-found: ignore

  adversarial-tests:
    # The security suite runs on its own so a regression shows up as its own red check
    # (docs/04-test-plan.md §6).
    name: Adversarial security tests
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 27.0
      - name: Install mise
        run: .github/scripts/install-mise.sh
      # Fails if the suite ran zero tests or any area's suite is missing from the output: a renamed or deleted suite
      # would otherwise pass silently as "fewer tests ran". The list of areas is in mise-tasks/test/adversarial.
      - name: mise run test:adversarial
        run: mise run test:adversarial

  strict-memory-safety:
    # Fails on any construct the compiler classifies as unsafe and that is not marked `unsafe` (ADR 0001, SE-0458).
    # SecureMemory is not exempted: it marks each one. Marked constructs compile anywhere, and the compiler does not
    # classify everything (e.g. `@_silgen_name` bindings), so the confinement script below backs this up.
    name: Strict memory safety
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 27.0
      - name: Install mise
        run: .github/scripts/install-mise.sh
      # `--require` turns a too-old compiler into a failure; without it the task skips, as `check` does on Xcode 16.4.
      - name: mise run build:strict --require
        run: mise run build:strict --require --verbose
      # A marked `unsafe` expression compiles in any module, so confinement to SecureMemory is checked separately.
      - name: mise run audit:unsafe
        run: mise run audit:unsafe

  lint:
    name: swift-format lint
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 27.0
      - name: Install mise
        run: .github/scripts/install-mise.sh
      - name: mise run lint
        run: mise run lint

  app-tests:
    # The Xcode app, unit and UI test suites (milestone 2 in docs/03-implementation-plan.md): AppKit and UIKit, the
    # AutoFill extension shells, and XCUITest, which needs the logged-in GUI session, automation mode and simulators
    # that only the macOS runner image provides. One leg per platform, so each reports as its own check and a failing
    # macOS leg does not stop the iOS leg from running. Both block merges through `required` below.
    name: App tests (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos
          - name: iOS simulator
            platform: ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 27.0

      - name: Install mise
        run: .github/scripts/install-mise.sh

      # XcodeGen comes from mise.toml, at the version, URL and SHA-256 recorded in mise.lock (docs/07-supply-chain.md
      # §3.3). `app:generate`, which the test task depends on, fails if the xcodegen on PATH is not that version, and
      # fails outright without Apps/project.yml, so a deleted project turns this check red rather than skipping it.
      - name: Install XcodeGen (mise, locked)
        run: mise install xcodegen

      # The task regenerates the project from Apps/project.yml first. See mise-tasks/app/test for the signing settings.
      - name: mise run app:test ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: mise run app:test "$PLATFORM" --results TestResults

      # Puts the failed run's summary, runner logs and crash reports into this log, which is readable without
      # downloading the result bundle or having Xcode's xcresulttool.
      - name: mise run app:diagnose TestResults
        if: failure()
        run: mise run app:diagnose TestResults

      # Enabling a third-party AutoFill provider from automation is unreliable on the simulator;
      # this attempt is informational and never blocks the pull request.
      - name: AutoFill extension UI test (best effort)
        if: matrix.platform == 'ios'
        continue-on-error: true
        run: mise run app:test ios --only-testing WatchwordUITests/AutoFillSettingsTests

      - name: Upload result bundles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcresults-${{ matrix.platform }}
          path: TestResults
          if-no-files-found: ignore

  required:
    # The one check branch protection on `main` requires (docs/08-repository-hardening.md §5). Matrix legs are named
    # after their runner and Xcode, so a runner bump renames them, and a required check that never reports again
    # blocks every pull request; this job's name does not change. It fails unless every job above succeeded:
    # `always()` makes it run (and fail) when one failed or was cancelled, where a plain `needs` would skip it, and a
    # skipped required check counts as passing.
    name: Required checks
    if: always()
    needs: [package-tests, adversarial-tests, strict-memory-safety, lint, app-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # GitHub-side plumbing with nothing to reproduce locally, so an expression rather than a mise task; each job it
      # gates names its own. A job result is one of success, failure, cancelled or skipped.
      - name: Fail unless every gate job succeeded
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A required job did not succeed; its own check on this pull request has the failure"
          exit 1
