name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; no job in this workflow needs more. Note the trigger is
# `pull_request`, not `pull_request_target`, so a fork's code never runs with repository secrets.
permissions:
  contents: read

# `bash` as the default shell runs with `-eo pipefail`, so a failing `swift test` is not masked
# by the `| tee` that captures its output.
defaults:
  run:
    shell: bash

# Third-party actions are pinned to full commit SHAs, not tags: a tag is mutable, so `@v4` is a
# standing grant of code execution in CI to whoever can move it (docs/07-supply-chain.md).
#   actions/checkout        v4 -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/upload-artifact v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  package-tests:
    name: Package tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported toolchain (Swift 6.0) on macOS 15.
          - name: Xcode 16.4 / macOS 15
            runner: macos-15
            xcode: "16.4"
          # Current toolchain on macOS 26. Avoid Xcode 26.0.x, which has a reported test-runner
          # hang on the macos-26 image (actions/runner-images#13143).
          - name: Xcode 26 / macOS 26
            runner: macos-26
            xcode: "26.6"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: .github/scripts/select-xcode.sh "$XCODE_VERSION"

      - name: Assert the package has no third-party dependencies
        run: .github/scripts/assert-no-dependencies.sh

      - name: Build
        run: swift build -v

      # `swift test` runs both the Swift Testing suites and the XCTest suites in the package.
      - name: Test (Swift Testing + XCTest)
        run: swift test --parallel --enable-code-coverage 2>&1 | tee test-output.log

      # Belt and braces: both frameworks must have executed tests, not merely compiled.
      - name: Verify both test frameworks ran
        run: |
          grep -Eq "Test run with [1-9][0-9]* tests?" test-output.log \
            || { echo "::error::No Swift Testing tests were executed"; exit 1; }
          # XCTest under `swift test --parallel` prints one "[n/m] Testing Target.Class/test" line per test.
          grep -Eq "\[[0-9]+/[1-9][0-9]*\] Testing [A-Za-z]+Tests\.|Test Case .* passed|Executed [1-9][0-9]* tests?" test-output.log \
            || { echo "::error::No XCTest tests were executed"; exit 1; }

      - name: Export coverage
        if: always()
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          PROFDATA=$(find "$BIN_PATH" -name 'default.profdata' | head -n 1 || true)
          XCTEST=$(find "$BIN_PATH" -name '*.xctest' -maxdepth 1 | head -n 1 || true)
          if [ -n "$PROFDATA" ] && [ -n "$XCTEST" ]; then
            BINARY="$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)"
            xcrun llvm-cov report "$BINARY" -instr-profile "$PROFDATA" -ignore-filename-regex='Tests/' > coverage.txt || true
            cat coverage.txt || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs-${{ strategy.job-index }}
          path: |
            test-output.log
            coverage.txt
          if-no-files-found: ignore

  adversarial-tests:
    # The security suite runs on its own so a regression shows up as its own red check
    # (docs/04-test-plan.md §6).
    name: Adversarial security tests
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 26.6
      - name: Run adversarial suite only
        run: swift test --parallel --filter WatchwordAdversarialTests 2>&1 | tee adversarial.log
      - name: Fail if the suite ran zero tests
        run: |
          if grep -Eq "Test run with 0 tests|Executed 0 tests" adversarial.log; then
            echo "::error::No adversarial tests were executed"
            exit 1
          fi
      # Every adversarial sub-suite must be present. A renamed or deleted suite would otherwise
      # pass silently as "fewer tests ran".
      - name: Verify each adversarial area is covered
        run: |
          for suite in "envelope and KDF" "AutoFill service matching" "password generator" "phishing resistance" \
                       "crypto core" "unlock and quick unlock" "local vault store" "Keychain item protection"; do
            grep -Fq "$suite" adversarial.log \
              || { echo "::error::Adversarial suite missing: $suite"; exit 1; }
          done

  strict-memory-safety:
    # Fails on any construct the compiler classifies as unsafe and that is not marked `unsafe` (ADR 0001, SE-0458).
    # SecureMemory is not exempted: it marks each one. Marked constructs compile anywhere, and the compiler does not
    # classify everything (e.g. `@_silgen_name` bindings), so the confinement script below backs this up.
    name: Strict memory safety
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 26.6
      - name: Build with -strict-memory-safety and warnings as errors
        run: swift build -v -Xswiftc -strict-memory-safety -Xswiftc -warnings-as-errors
      # A marked `unsafe` expression compiles in any module, so confinement to SecureMemory is checked separately.
      - name: Assert unsafe code is confined to SecureMemory
        run: .github/scripts/assert-unsafe-confined.sh

  lint:
    name: swift-format lint
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 26.6
      - name: Lint
        run: swift format lint --strict --recursive --configuration .swift-format Package.swift Sources Tests Apps

  app-tests:
    # Runs the Xcode app and UI test suites once the app project exists (milestone 2 in
    # docs/03-implementation-plan.md). Until Apps/project.yml is committed the job succeeds
    # after reporting that it was skipped.
    name: App tests (macOS + iOS simulator)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 26.6

      - name: Detect app project
        id: detect
        run: |
          if [ -f Apps/project.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apps/project.yml not found; app tests skipped"
          fi

      # XcodeGen is a build-time dependency fetched from Homebrew, unpinned (docs/07-supply-chain.md §3.3): the plan is
      # a pinned release archive with a verified SHA-256, or a committed project with a drift check.
      - name: Install XcodeGen
        if: steps.detect.outputs.present == 'true'
        run: brew install --quiet xcodegen

      - name: Generate project
        if: steps.detect.outputs.present == 'true'
        run: xcodegen generate --spec Apps/project.yml --project Apps

      # A macOS XCUITest runner that is not signed at all hangs before connecting, so the macOS leg signs ad hoc. The
      # entitlements are dropped (they need a provisioning profile); UI tests launch with `--uitest`, which uses
      # in-memory ports and needs no App Group or Keychain access.
      - name: macOS app tests (XCTest + Swift Testing + XCUITest)
        if: steps.detect.outputs.present == 'true'
        run: |
          xcodebuild test \
            -project Apps/Watchword.xcodeproj \
            -scheme Watchword-macOS \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults/macOS.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= CODE_SIGN_ENTITLEMENTS=""

      - name: Pick an iOS simulator
        if: steps.detect.outputs.present == 'true'
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(dev["udid"] for rt,devs in d.items() if "iOS" in rt for dev in devs if dev["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: iOS app tests (XCTest + Swift Testing + XCUITest)
        if: steps.detect.outputs.present == 'true'
        run: |
          xcodebuild test \
            -project Apps/Watchword.xcodeproj \
            -scheme Watchword-iOS \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults/iOS.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Enabling a third-party AutoFill provider from automation is unreliable on the simulator;
      # this attempt is informational and never blocks the pull request.
      - name: AutoFill extension UI test (best effort)
        if: steps.detect.outputs.present == 'true'
        continue-on-error: true
        run: |
          xcodebuild test \
            -project Apps/Watchword.xcodeproj \
            -scheme Watchword-iOS \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:WatchwordUITests/AutoFillSettingsTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload result bundles
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcresults
          path: TestResults
          if-no-files-found: ignore
