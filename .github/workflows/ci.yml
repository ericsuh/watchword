name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; no job in this workflow needs more. Note the trigger is
# `pull_request`, not `pull_request_target`, so a fork's code never runs with repository secrets.
permissions:
  contents: read

# `bash` as the default shell runs with `-eo pipefail`. The task scripts set `-euo pipefail` themselves, so a failing
# `swift test` is not masked by the `| tee` that captures its output either way.
defaults:
  run:
    shell: bash

# Every step past checkout and Xcode selection is `mise run <task>`, the same command a developer runs locally
# (mise.toml, `mise-tasks/`), so a red step reproduces with the command in its log. `.github/scripts/install-mise.sh`
# installs mise (pinned by version and SHA-256) and sets its CI behaviour for the rest of the job: locked tool
# downloads, no auto-install, no version host. The settings and their reasons are listed in that script.

# Third-party actions are pinned to full commit SHAs, not tags: a tag is mutable, so `@v4` is a
# standing grant of code execution in CI to whoever can move it (docs/07-supply-chain.md).
#   actions/checkout        v4 -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/upload-artifact v4 -> ea165f8d65b6e75b540449e92b4886f43607fa02

jobs:
  package-tests:
    name: Package tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported toolchain (Swift 6.0) on macOS 15.
          - name: Xcode 16.4 / macOS 15
            runner: macos-15
            xcode: "16.4"
          # Current toolchain on macOS 26. Avoid Xcode 26.0.x, which has a reported test-runner
          # hang on the macos-26 image (actions/runner-images#13143).
          - name: Xcode 26 / macOS 26
            runner: macos-26
            xcode: "26.6"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: .github/scripts/select-xcode.sh "$XCODE_VERSION"

      - name: Install mise
        run: .github/scripts/install-mise.sh

      - name: mise run audit:dependencies
        run: mise run audit:dependencies

      - name: mise run build
        run: mise run build -v

      # Both the Swift Testing and XCTest suites; the task fails unless the log shows each framework executed tests,
      # and writes coverage.txt whether or not they passed.
      - name: mise run test --coverage
        run: mise run test --coverage --log test-output.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-logs-${{ strategy.job-index }}
          path: |
            test-output.log
            coverage.txt
          if-no-files-found: ignore

  adversarial-tests:
    # The security suite runs on its own so a regression shows up as its own red check
    # (docs/04-test-plan.md §6).
    name: Adversarial security tests
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 26.6
      - name: Install mise
        run: .github/scripts/install-mise.sh
      # Fails if the suite ran zero tests or any area's suite is missing from the output: a renamed or deleted suite
      # would otherwise pass silently as "fewer tests ran". The list of areas is in mise-tasks/test/adversarial.
      - name: mise run test:adversarial
        run: mise run test:adversarial

  strict-memory-safety:
    # Fails on any construct the compiler classifies as unsafe and that is not marked `unsafe` (ADR 0001, SE-0458).
    # SecureMemory is not exempted: it marks each one. Marked constructs compile anywhere, and the compiler does not
    # classify everything (e.g. `@_silgen_name` bindings), so the confinement script below backs this up.
    name: Strict memory safety
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 26.6
      - name: Install mise
        run: .github/scripts/install-mise.sh
      # `--require` turns a too-old compiler into a failure; without it the task skips, as `check` does on Xcode 16.4.
      - name: mise run build:strict --require
        run: mise run build:strict --require --verbose
      # A marked `unsafe` expression compiles in any module, so confinement to SecureMemory is checked separately.
      - name: mise run audit:unsafe
        run: mise run audit:unsafe

  lint:
    name: swift-format lint
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 26.6
      - name: Install mise
        run: .github/scripts/install-mise.sh
      - name: mise run lint
        run: mise run lint

  app-tests:
    # Runs the Xcode app and UI test suites once the app project exists (milestone 2 in
    # docs/03-implementation-plan.md). Until Apps/project.yml is committed the job succeeds
    # after reporting that it was skipped.
    name: App tests (macOS + iOS simulator)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 26.6

      - name: Detect app project
        id: detect
        run: |
          if [ -f Apps/project.yml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apps/project.yml not found; app tests skipped"
          fi

      - name: Install mise
        if: steps.detect.outputs.present == 'true'
        run: .github/scripts/install-mise.sh

      # XcodeGen comes from mise.toml, at the version, URL and SHA-256 recorded in mise.lock (docs/07-supply-chain.md
      # §3.3). `app:generate`, which both test tasks depend on, fails if the xcodegen on PATH is not that version.
      - name: Install XcodeGen (mise, locked)
        if: steps.detect.outputs.present == 'true'
        run: mise install xcodegen

      # Each task regenerates the project from Apps/project.yml first. See mise-tasks/app/test for the signing settings.
      - name: mise run app:test macos
        if: steps.detect.outputs.present == 'true'
        run: mise run app:test macos --results TestResults

      - name: mise run app:test ios
        if: steps.detect.outputs.present == 'true'
        run: mise run app:test ios --results TestResults

      # Enabling a third-party AutoFill provider from automation is unreliable on the simulator;
      # this attempt is informational and never blocks the pull request.
      - name: AutoFill extension UI test (best effort)
        if: steps.detect.outputs.present == 'true'
        continue-on-error: true
        run: mise run app:test ios --only-testing WatchwordUITests/AutoFillSettingsTests

      - name: Upload result bundles
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcresults
          path: TestResults
          if-no-files-found: ignore
