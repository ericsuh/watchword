name: Screenshots

# Captures a picture of every major screen of the iOS and macOS apps for a pull request and attaches them to it, so a
# change to the UI can be audited by eye (docs/04-test-plan.md §5). It runs when a pull request:
#   - is given the `screenshots` label, and again on each push while it carries the label;
#   - gets a push whose head commit message contains `[screenshots]`;
# or when it is dispatched by hand, optionally naming the pull request to attach the result to. It never gates a merge:
# it is not in ci.yml's `required` job and must not be added to branch protection.
#
# Three jobs, split by what they may touch (docs/07-supply-chain.md §3.2):
#   - `decide` reads the event and, for the commit marker, one commit message through the API. Read-only token, no
#     checkout.
#   - `capture` checks out and runs the pull request's code (the screenshot tour, `mise run app:screenshots`), so it
#     gets what ci.yml's app-tests job gets: `contents: read`, no secrets, no persisted credentials. Its output is
#     artifacts, a job summary, and a list of screen names.
#   - `comment` is the only job with `pull-requests: write`. It checks nothing out and runs nothing from the pull
#     request: it validates the names and artifact ids `capture` reported and creates or updates one comment, found by
#     a hidden marker and by its author being this workflow's own bot account.
# A fork's pull request gets the capture and its artifacts but no comment: GitHub makes its token read-only whatever
# this file asks for. A comment command (`/screenshots`) is deliberately absent; §3.2 says why.
#
# The two jobs that check nothing out cannot run a mise task, so their few lines of `gh api` are inline, as in
# claude-pr.yml's `authorize` job; event text reaches them only through `env:`. Everything that touches the code is a
# mise task. GitHub does not serve artifact files inside a comment, and no job here may write to the repository, so
# the comment links to the artifacts rather than showing the pictures.

on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Pull request to attach the result to; its head must be the dispatched commit. Empty: artifacts only"
        type: string
        default: ""
      appearance:
        description: "dark tours the app in the dark appearance"
        type: choice
        options: [light, dark]
        default: light
      device:
        description: "ipad tours the iOS app on an iPad simulator"
        type: choice
        options: [iphone, ipad]
        default: iphone

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Pinned to full commit SHAs, not tags (docs/07-supply-chain.md §3.1).
#   actions/checkout        v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/upload-artifact v7.0.2 -> cf430e030ddbb5b0abf93d22962f4752f3646cd9

jobs:
  decide:
    name: Decide
    # A label other than `screenshots` starts no runner.
    if: github.event.action != 'labeled' || github.event.label.name == 'screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      capture: ${{ steps.decide.outputs.capture }}
      comment: ${{ steps.decide.outputs.comment }}
      pull_request: ${{ steps.decide.outputs.pull_request }}
      head: ${{ steps.decide.outputs.head }}
    steps:
      - name: Decide whether to capture, and whether a comment can be posted
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          LABEL: ${{ github.event.label.name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'screenshots') }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          capture=false comment=false
          if [ "$EVENT" = workflow_dispatch ]; then
            capture=true
            echo "::notice::Capturing: dispatched by hand."
            if [ -n "$PR_NUMBER" ]; then
              if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]; then
                echo "::error::pull_request must be a pull request number"
                exit 1
              fi
              # The pictures are of the dispatched commit, so they may only be attached to a pull request whose head
              # is that commit, in this repository.
              found=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.state, .head.sha, .head.repo.full_name] | join(" ")')
              if [ "$found" != "open $HEAD_SHA $REPO" ]; then
                echo "::error::#$PR_NUMBER is not an open pull request of this repository with head $HEAD_SHA (it is: $found). Dispatch on its branch."
                exit 1
              fi
              comment=true
            fi
          else
            if [ "$ACTION" = labeled ] && [ "$LABEL" = screenshots ]; then
              capture=true
              echo "::notice::Capturing: the screenshots label was added."
            elif [ "$ACTION" != labeled ] && [ "$LABELLED" = true ]; then
              capture=true
              echo "::notice::Capturing: a push to a pull request that carries the screenshots label."
            elif [ "$ACTION" != labeled ]; then
              # The event does not carry the commit message. It is read here, as data, and only searched.
              message=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message)
              if grep -qF -- '[screenshots]' <<<"$message"; then
                capture=true
                echo "::notice::Capturing: the head commit's message contains [screenshots]."
              fi
            fi
            # A fork's token cannot comment, whatever the comment job's permissions say.
            if [ "$HEAD_REPO" = "$REPO" ]; then comment=true; fi
          fi
          if [ "$capture" = false ]; then
            echo "::notice::Not capturing: no screenshots label, and no [screenshots] in the head commit's message."
          fi
          {
            echo "capture=$capture"
            echo "comment=$comment"
            echo "pull_request=$PR_NUMBER"
            echo "head=$HEAD_SHA"
          } >>"$GITHUB_OUTPUT"

  capture:
    # Runs the pull request's code, so it holds nothing worth taking: a read-only token and no secrets, as in ci.yml.
    name: Capture (${{ matrix.name }})
    needs: decide
    if: needs.decide.outputs.capture == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    # A newer push replaces a capture that is still running for the same pull request (or branch) and platform. Only
    # runs that got this far are in the group, so an unrelated label or a push that decides not to capture cancels
    # nothing.
    concurrency:
      group: screenshots-capture-${{ github.event.pull_request.number || github.ref }}-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS simulator
            platform: ios
          - name: macOS
            platform: macos
    # Each leg sets only its own platform's outputs; an output a leg leaves empty does not overwrite the other leg's.
    outputs:
      screens_ios: ${{ steps.capture.outputs.screens_ios }}
      screens_macos: ${{ steps.capture.outputs.screens_macos }}
      images_ios: ${{ matrix.platform == 'ios' && steps.images.outputs.artifact-id || '' }}
      images_macos: ${{ matrix.platform == 'macos' && steps.images.outputs.artifact-id || '' }}
      sheet_ios: ${{ matrix.platform == 'ios' && steps.sheet.outputs.artifact-id || '' }}
      sheet_macos: ${{ matrix.platform == 'macos' && steps.sheet.outputs.artifact-id || '' }}
    steps:
      # The pull request merged with its base, as ci.yml tests it; for a dispatch, the dispatched branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: .github/scripts/select-xcode.sh 27.0

      - name: Install mise
        run: .github/scripts/install-mise.sh

      # As in ci.yml's app-tests job: XcodeGen at the version and SHA-256 in mise.lock.
      - name: Install XcodeGen (mise, locked)
        run: mise install xcodegen

      # Runs the tour, writes Screenshots/<set>/ and the one-file contact sheet, appends the index to the job summary,
      # and fails if the tour failed, a screen is missing or a picture is blank (mise-tasks/app/screenshots).
      - name: mise run app:screenshots ${{ matrix.platform }}
        id: capture
        env:
          PLATFORM: ${{ matrix.platform }}
          APPEARANCE: ${{ inputs.appearance || 'light' }}
          DEVICE: ${{ matrix.platform == 'ios' && inputs.device || 'iphone' }}
          SOURCE: >-
            ${{ github.event_name == 'pull_request'
            && format('Pull request #{0} at {1}, merged with {2}.', github.event.pull_request.number,
            github.event.pull_request.head.sha, github.event.pull_request.base.ref)
            || format('Commit {0} on {1}.', github.sha, github.ref_name) }}
        # `--flag=value`, one word each, so no value can be read as an option.
        run: >-
          mise run app:screenshots "$PLATFORM" "--appearance=$APPEARANCE" "--device=$DEVICE" "--source=$SOURCE"

      - name: mise run app:diagnose
        if: failure()
        env:
          RESULTS: TestResults/Screenshots/${{ steps.capture.outputs.set }}
        run: mise run app:diagnose "$RESULTS"

      # The set as a directory: every PNG, index.md, and index.html, which shows them all once unzipped.
      - name: Upload the screenshots
        id: images
        if: always() && steps.capture.outputs.directory != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ steps.capture.outputs.set }}
          path: ${{ steps.capture.outputs.directory }}
          if-no-files-found: ignore

      # The same contact sheet with the pictures embedded, uploaded as the file itself rather than a zip
      # (`archive: false`, which takes one file and names the artifact after it), so its link opens the sheet.
      - name: Upload the contact sheet
        id: sheet
        if: always() && steps.capture.outputs.sheet != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.capture.outputs.sheet }}
          archive: false
          if-no-files-found: ignore

      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-xcresult-${{ matrix.platform }}
          path: TestResults/Screenshots
          if-no-files-found: ignore

  comment:
    # The one job that can write, and only comments. No checkout, no artifact download, nothing from the pull request
    # but the names and ids below, each checked against a pattern before it is used.
    name: Comment
    needs: [decide, capture]
    if: >-
      always() && needs.decide.outputs.comment == 'true'
      && (needs.capture.result == 'success' || needs.capture.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One at a time per pull request, in order, so two runs cannot both find no comment and each create one.
    concurrency:
      group: screenshots-comment-${{ needs.decide.outputs.pull_request }}
      cancel-in-progress: false
    # Not even `contents: read`: it reads nothing from the repository.
    permissions:
      pull-requests: write
    steps:
      - name: Create or update the screenshots comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          APPEARANCE: ${{ inputs.appearance }}
          DEVICE: ${{ inputs.device }}
          PR_NUMBER: ${{ needs.decide.outputs.pull_request }}
          HEAD_SHA: ${{ needs.decide.outputs.head }}
          SCREENS_IOS: ${{ needs.capture.outputs.screens_ios }}
          SCREENS_MACOS: ${{ needs.capture.outputs.screens_macos }}
          IMAGES_IOS: ${{ needs.capture.outputs.images_ios }}
          IMAGES_MACOS: ${{ needs.capture.outputs.images_macos }}
          SHEET_IOS: ${{ needs.capture.outputs.sheet_ios }}
          SHEET_MACOS: ${{ needs.capture.outputs.sheet_macos }}
        run: |
          set -euo pipefail
          marker='<!-- watchword-screenshots -->'
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The pull request number, head commit or run id is not what it should be; not commenting."
            exit 1
          fi
          run="$SERVER/$REPO/actions/runs/$RUN_ID"
          name='[0-9]{2}-[a-z0-9]+(-[a-z0-9]+)*'

          platform() { # platform <title> <screen names> <images artifact id> <contact sheet artifact id>
            local title="$1" screens="$2" images="$3" sheet="$4" count links=""
            if [ "${#screens}" -gt 8000 ] || ! [[ "$screens" =~ ^$name(,$name)*$ ]]; then
              echo "- **$title:** the capture failed or is incomplete. The [run]($run) says why."
              return
            fi
            count=$(tr ',' '\n' <<<"$screens" | wc -l | tr -d ' ')
            if [[ "$sheet" =~ ^[0-9]+$ ]]; then links="[contact sheet]($run/artifacts/$sheet), one HTML file"; fi
            if [[ "$images" =~ ^[0-9]+$ ]]; then links+="${links:+; }[every PNG]($run/artifacts/$images), zipped"; fi
            echo "- **$title:** $count screens. ${links:-No artifact was uploaded.}"
            echo
            echo "  <details><summary>The $count screens, in the order the tour meets them</summary>"
            echo
            tr ',' '\n' <<<"$screens" | sed 's/.*/  - `&`/'
            echo
            echo "  </details>"
          }

          {
            echo "$marker"
            echo "### Screenshots"
            echo
            if [ "$EVENT" = pull_request ]; then
              echo "Of \`$HEAD_SHA\`, merged with the base branch as CI tests it. Captured by [this run]($run)."
            else
              echo "Of \`$HEAD_SHA\`. Captured by [this run]($run), dispatched by hand."
            fi
            if [ "$APPEARANCE" = dark ]; then echo "In the dark appearance."; fi
            if [ "$DEVICE" = ipad ]; then echo "The iOS set is from an iPad simulator."; fi
            echo
            platform "iOS simulator" "$SCREENS_IOS" "$IMAGES_IOS" "$SHEET_IOS"
            platform "macOS" "$SCREENS_MACOS" "$IMAGES_MACOS" "$SHEET_MACOS"
            echo
            echo "GitHub does not show artifact files inside a comment, so the pictures are behind the links (sign-in"
            echo "needed). This comment is rewritten on each push while the pull request carries the \`screenshots\`"
            echo "label, and when a head commit's message contains \`[screenshots]\`."
          } >body.md

          # Only this workflow's own earlier comment is updated: one that starts with the marker and was written by
          # the Actions bot. Anyone can write the marker; nobody else can be that author.
          existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- watchword-screenshots -->"))) | .id')
          existing="${existing%%$'\n'*}"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@body.md --jq .html_url
          fi
